<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بانک پوکر</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2a5298">
    <meta name="application-name" content="بانک پوکر">
    <meta name="apple-mobile-web-app-title" content="بانک پوکر">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            color: #2a5298;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(42, 82, 152, 0.3);
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: #1e3c72;
            transform: scale(1.1);
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .side-menu.open {
            left: 0;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .menu-overlay.show {
            display: block;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
        }

        .menu-close {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border: none;
            border-radius: 10px;
            text-align: right;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            border-right: 4px solid #2a5298;
        }

        .menu-item:hover {
            background: #e9ecef;
            transform: translateX(-5px);
        }

        .main-content {
            transition: all 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #2a5298;
            color: white;
        }

        .btn-primary:hover {
            background: #1e3c72;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            width: auto;
            padding: 8px 15px;
            margin-bottom: 20px;
        }

        .btn-small {
            width: auto;
            padding: 5px 10px;
            font-size: 14px;
            margin: 2px;
        }

        .player-row {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 4px solid #2a5298;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .player-row.active {
            background: #e8f5e9;
            border-right-color: #28a745;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .player-stats {
            font-size: 13px;
            color: #666;
        }

        .buy-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .buy-display {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            border: 2px solid #dee2e6;
        }

        .control-btn {
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #1e3c72;
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .remove-btn {
            background: #dc3545;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .player-selector {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .player-selector h4 {
            margin-bottom: 10px;
            color: #2a5298;
        }

        .player-chips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .player-chip {
            background: white;
            border: 2px solid #2a5298;
            color: #2a5298;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s;
            font-weight: 500;
        }

        .player-chip:hover {
            background: #2a5298;
            color: white;
            transform: translateY(-2px);
        }

        .player-chip.selected {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        .game-result {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .profit {
            color: #28a745;
            font-weight: bold;
        }

        .loss {
            color: #dc3545;
            font-weight: bold;
        }

        .history-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .history-date {
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 10px;
        }

        .player-result {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stats-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .balance-warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .balance-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .balance-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .summary-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20% auto;
            max-width: 320px;
            text-align: center;
            position: relative;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .chip-info {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2a5298;
            font-size: 14px;
        }

        .auto-save-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 167, 69, 0.9);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1001;
            display: none;
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .saved-game-banner {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .saved-game-banner button {
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }

            .buy-controls {
                gap: 5px;
            }

            .control-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="auto-save-indicator" id="autoSaveIndicator">💾 ذخیره خودکار...</div>
    <div class="menu-overlay" onclick="closeMenu()"></div>
    
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>📋 منوی اصلی</h3>
            <button class="menu-close" onclick="closeMenu()">✕</button>
        </div>
        <button class="menu-item" onclick="startNewGame()">🎮 بازی جدید</button>
        <button class="menu-item" onclick="showPage('players')">👥 مدیریت بازیکنان</button>
        <button class="menu-item" onclick="showPage('history')">📜 تاریخچه بازی‌ها</button>
        <button class="menu-item" onclick="showPage('stats')">📊 آمار بازیکنان</button>
    </div>

    <div class="container">
        <div class="header">
            <button class="menu-btn" onclick="openMenu()">☰</button>
            <h1>🎰 بانک پوکر</h1>
            <p>مدیریت کامل حسابداری بازی‌های پوکر</p>
        </div>

        <!-- صفحه بازی -->
        <div id="game" class="page active">
            <div class="main-content">
                <div id="saved-game-notice"></div>

                <div class="form-group">
                    <label>تاریخ بازی (شمسی):</label>
                    <input type="text" id="game-date" placeholder="مثال: 1403/09/06" readonly onclick="showDatePicker()">
                </div>

                <div class="chip-info">
                    💰 هر خرید = 500 ژتون = 100,000 تومان
                </div>

                <div class="player-selector">
                    <h4>🎯 انتخاب بازیکنان:</h4>
                    <div class="player-chips-grid" id="availablePlayers"></div>
                </div>

                <div id="active-players">
                    <h4 style="margin-bottom: 10px; color: #2a5298;">بازیکنان فعال:</h4>
                </div>

                <div id="game-summary"></div>

                <div id="finish-section" style="display: none;">
                    <h3 style="margin: 20px 0 15px 0;">🏁 پایان بازی</h3>
                    
                    <div class="chip-info">
                        🎲 تعداد ژتون نهایی هر بازیکن را وارد کنید
                    </div>

                    <div id="final-tokens-input"></div>

                    <div id="balance-check"></div>
                    <div id="final-results"></div>

                    <button class="btn btn-success" onclick="saveGame()" id="save-btn">💾 ذخیره بازی</button>
                </div>

                <button class="btn btn-success" onclick="showFinishSection()" id="finish-btn" style="margin-top: 20px;">🏁 پایان بازی</button>
            </div>
        </div>

        <!-- صفحه مدیریت بازیکنان -->
        <div id="players" class="page">
            <button class="btn btn-back" onclick="showPage('game')">← برگشت</button>
            <h3 style="margin-bottom: 15px;">👥 مدیریت بازیکنان</h3>
            
            <div class="form-group">
                <label>نام بازیکن جدید:</label>
                <input type="text" id="new-player-input" placeholder="نام بازیکن را وارد کنید">
            </div>
            <button class="btn btn-primary" onclick="addNewPlayer()">➕ اضافه کردن بازیکن</button>

            <div id="all-players-list"></div>
        </div>

        <!-- صفحه تاریخچه -->
        <div id="history" class="page">
            <button class="btn btn-back" onclick="showPage('game')">← برگشت</button>
            <h3 style="margin-bottom: 15px;">📜 تاریخچه بازی‌ها</h3>
            <div id="games-history"></div>
        </div>

        <!-- صفحه آمار -->
        <div id="stats" class="page">
            <button class="btn btn-back" onclick="showPage('game')">← برگشت</button>
            <h3 style="margin-bottom: 15px;">📊 آمار بازیکنان</h3>
            <div id="players-stats"></div>
        </div>
    </div>

    <!-- مودال تایید -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div id="modal-message"></div>
            <div class="modal-buttons">
                <button class="modal-btn" style="background: #28a745; color: white;" onclick="confirmAction()">تایید</button>
                <button class="modal-btn" style="background: #6c757d; color: white;" onclick="closeModal()">لغو</button>
            </div>
        </div>
    </div>

    <!-- مودال انتخاب تاریخ -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <h4 style="margin-bottom: 15px;">انتخاب تاریخ</h4>
            <div class="form-group">
                <label>سال:</label>
                <select id="year-select"></select>
            </div>
            <div class="form-group">
                <label>ماه:</label>
                <select id="month-select"></select>
            </div>
            <div class="form-group">
                <label>روز:</label>
                <select id="day-select"></select>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" style="background: #28a745; color: white;" onclick="setSelectedDate()">تایید</button>
                <button class="modal-btn" style="background: #6c757d; color: white;" onclick="closeDateModal()">لغو</button>
            </div>
        </div>
    </div>

    <script>
        let currentGame = {
            date: '',
            players: [],
            buyIns: {},
            finalTokens: {},
            results: {}
        };

        let allPlayersList = JSON.parse(localStorage.getItem('allPlayersList') || '[]');
        let gameHistory = JSON.parse(localStorage.getItem('pokerGameHistory') || '[]');
        let confirmCallback = null;
        let autoSaveInterval = null;

        const TOKENS_PER_BUY = 500;
        const PRICE_PER_BUY = 100000;

        const persianMonths = [
            'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
            'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
        ];

        // Initialize
        setDefaultPersianDate();
        loadSavedGame();
        renderAvailablePlayers();
        startAutoSave();

        function startAutoSave() {
            autoSaveInterval = setInterval(() => {
                if (currentGame.players.length > 0) {
                    saveCurrentGame();
                    showAutoSaveIndicator();
                }
            }, 10000); // هر 10 ثانیه
        }

        function saveCurrentGame() {
            localStorage.setItem('currentGame', JSON.stringify(currentGame));
        }

        function loadSavedGame() {
            const saved = localStorage.getItem('currentGame');
            if (saved) {
                const savedGame = JSON.parse(saved);
                if (savedGame.players && savedGame.players.length > 0) {
                    const notice = document.getElementById('saved-game-notice');
                    notice.innerHTML = `
                        <div class="saved-game-banner">
                            <strong>💾 بازی ذخیره شده پیدا شد!</strong>
                            <br><small>تاریخ: ${savedGame.date || 'نامشخص'}</small>
                            <div style="display: flex; gap: 10px; margin-top: 10px;">
                                <button class="btn btn-success" onclick="restoreSavedGame()" style="flex: 1;">بازگردانی</button>
                                <button class="btn btn-danger" onclick="clearSavedGame()" style="flex: 1;">حذف</button>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function restoreSavedGame() {
            const saved = localStorage.getItem('currentGame');
            if (saved) {
                currentGame = JSON.parse(saved);
                document.getElementById('game-date').value = currentGame.date;
                document.getElementById('saved-game-notice').innerHTML = '';
                renderActivePlayers();
                renderAvailablePlayers();
                updateGameSummary();
                showAlert('بازی بازگردانی شد!', 'success');
            }
        }

        function clearSavedGame() {
            localStorage.removeItem('currentGame');
            document.getElementById('saved-game-notice').innerHTML = '';
            showAlert('بازی ذخیره شده حذف شد', 'info');
        }

        function showAutoSaveIndicator() {
            const indicator = document.getElementById('autoSaveIndicator');
            indicator.style.display = 'block';
            setTimeout(() => {
                indicator.style.display = 'none';
            }, 2000);
        }

        function setDefaultPersianDate() {
            const today = new Date();
            const persianDate = gregorianToPersian(today);
            document.getElementById('game-date').value = `${persianDate.year}/${persianDate.month.toString().padStart(2, '0')}/${persianDate.day.toString().padStart(2, '0')}`;
        }

        function gregorianToPersian(gregorianDate) {
            const g_y = gregorianDate.getFullYear();
            const g_m = gregorianDate.getMonth() + 1;
            const g_d = gregorianDate.getDate();
            
            let p_y = g_y - 621;
            if (g_m < 3 || (g_m === 3 && g_d < 21)) {
                p_y--;
            }
            
            const p_m = ((g_m + 9) % 12) + 1;
            const p_d = Math.min(g_d, 30);
            
            return { year: p_y, month: p_m, day: p_d };
        }

        function showDatePicker() {
            const modal = document.getElementById('dateModal');
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const daySelect = document.getElementById('day-select');
            
            yearSelect.innerHTML = '';
            for (let year = 1400; year <= 1410; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === 1403) option.selected = true;
                yearSelect.appendChild(option);
            }
            
            monthSelect.innerHTML = '';
            persianMonths.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
            
            updateDaySelect();
            modal.style.display = 'block';
        }

        function updateDaySelect() {
            const daySelect = document.getElementById('day-select');
            daySelect.innerHTML = '';
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            }
        }

        function setSelectedDate() {
            const year = document.getElementById('year-select').value;
            const month = document.getElementById('month-select').value.padStart(2, '0');
            const day = document.getElementById('day-select').value.padStart(2, '0');
            
            document.getElementById('game-date').value = `${year}/${month}/${day}`;
            currentGame.date = `${year}/${month}/${day}`;
            saveCurrentGame();
            closeDateModal();
        }

        function closeDateModal() {
            document.getElementById('dateModal').style.display = 'none';
        }

        document.getElementById('month-select').addEventListener('change', updateDaySelect);

        function renderAvailablePlayers() {
            const container = document.getElementById('availablePlayers');
            container.innerHTML = '';

            if (allPlayersList.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">هنوز بازیکنی تعریف نشده<br><small>از منو > مدیریت بازیکنان بازیکن اضافه کنید</small></p>';
                return;
            }

            allPlayersList.forEach(player => {
                const chip = document.createElement('button');
                chip.className = 'player-chip';
                chip.textContent = player;
                chip.onclick = () => selectPlayerForGame(player);
                
                if (currentGame.players.includes(player)) {
                    chip.classList.add('selected');
                }
                
                container.appendChild(chip);
            });
        }

        function selectPlayerForGame(playerName) {
            if (currentGame.players.includes(playerName)) {
                showAlert('این بازیکن قبلاً به بازی اضافه شده است', 'warning');
                return;
            }

            currentGame.players.push(playerName);
            currentGame.buyIns[playerName] = TOKENS_PER_BUY; // یک خرید پیش‌فرض
            currentGame.finalTokens[playerName] = 0;

            renderAvailablePlayers();
            renderActivePlayers();
            updateGameSummary();
            saveCurrentGame();
            showAlert(`${playerName} با 1 خرید به بازی اضافه شد`, 'success');
        }

        function renderActivePlayers() {
            const container = document.getElementById('active-players');
            
            if (currentGame.players.length === 0) {
                container.innerHTML = '<h4 style="margin-bottom: 10px; color: #2a5298;">بازیکنان فعال:</h4><p style="text-align: center; color: #666; padding: 20px;">هنوز بازیکنی انتخاب نشده</p>';
                return;
            }

            let html = '<h4 style="margin-bottom: 10px; color: #2a5298;">بازیکنان فعال:</h4>';
            
            currentGame.players.forEach(player => {
                const tokens = currentGame.buyIns[player] || 0;
                const buyCount = tokens / TOKENS_PER_BUY;
                const money = (tokens / TOKENS_PER_BUY) * PRICE_PER_BUY;

                html += `
                    <div class="player-row active">
                        <div class="player-info">
                            <div class="player-name">${player}</div>
                            <div class="player-stats">${tokens} ژتون (${money.toLocaleString()} تومان)</div>
                        </div>
                        <div class="buy-controls">
                            <button class="control-btn" onclick="decreaseBuy('${player}')">−</button>
                            <div class="buy-display">${buyCount}</div>
                            <button class="control-btn" onclick="increaseBuy('${player}')">+</button>
                            <button class="control-btn remove-btn" onclick="removePlayerFromGame('${player}')">✕</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function increaseBuy(playerName) {
            currentGame.buyIns[playerName] = (currentGame.buyIns[playerName] || 0) + TOKENS_PER_BUY;
            renderActivePlayers();
            updateGameSummary();
            saveCurrentGame();
        }

        function decreaseBuy(playerName) {
            const currentTokens = currentGame.buyIns[playerName] || 0;
            if (currentTokens > TOKENS_PER_BUY) {
                currentGame.buyIns[playerName] = currentTokens - TOKENS_PER_BUY;
                renderActivePlayers();
                updateGameSummary();
                saveCurrentGame();
            } else {
                showAlert('حداقل باید یک خرید داشته باشد', 'warning');
            }
        }

        function removePlayerFromGame(playerName) {
            showConfirm(`آیا مطمئنید که می‌خواهید "${playerName}" را از بازی حذف کنید؟`, () => {
                const index = currentGame.players.indexOf(playerName);
                if (index > -1) {
                    currentGame.players.splice(index, 1);
                    delete currentGame.buyIns[playerName];
                    delete currentGame.finalTokens[playerName];
                    renderAvailablePlayers();
                    renderActivePlayers();
                    updateGameSummary();
                    saveCurrentGame();
                }
            });
        }

        function updateGameSummary() {
            const container = document.getElementById('game-summary');
            
            if (currentGame.players.length === 0) {
                container.innerHTML = '';
                document.getElementById('finish-btn').style.display = 'none';
                return;
            }

            document.getElementById('finish-btn').style.display = 'block';

            let totalTokens = 0;
            let totalMoney = 0;

            currentGame.players.forEach(player => {
                const tokens = currentGame.buyIns[player] || 0;
                const money = (tokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                totalTokens += tokens;
                totalMoney += money;
            });

            container.innerHTML = `
                <div class="summary-box">
                    <h4 style="margin-bottom: 10px;">📊 خلاصه بازی</h4>
                    <div class="summary-row">
                        <span>تعداد بازیکنان:</span>
                        <span>${currentGame.players.length} نفر</span>
                    </div>
                    <div class="summary-row">
                        <span>کل ژتون‌ها:</span>
                        <span>${totalTokens.toLocaleString()} ژتون</span>
                    </div>
                    <div class="summary-row">
                        <span>کل پول:</span>
                        <span style="color: #2a5298;">${totalMoney.toLocaleString()} تومان</span>
                    </div>
                </div>
            `;
        }

        function showFinishSection() {
            if (currentGame.players.length < 2) {
                showAlert('حداقل 2 بازیکن برای پایان بازی نیاز است', 'danger');
                return;
            }

            currentGame.date = document.getElementById('game-date').value;
            
            if (!currentGame.date) {
                showAlert('لطفا تاریخ بازی را انتخاب کنید', 'danger');
                return;
            }

            document.getElementById('finish-section').style.display = 'block';
            document.getElementById('finish-btn').style.display = 'none';
            
            renderFinalTokensInput();
            window.scrollTo(0, document.body.scrollHeight);
        }

        function renderFinalTokensInput() {
            const container = document.getElementById('final-tokens-input');
            let html = '';

            currentGame.players.forEach(player => {
                const finalTokens = currentGame.finalTokens[player] || 0;
                html += `
                    <div class="player-row">
                        <div class="player-info">
                            <div class="player-name">${player}</div>
                            <div class="player-stats">ژتون نهایی</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="number" 
                                   id="final-${player}" 
                                   value="${finalTokens || ''}" 
                                   placeholder="0" 
                                   min="0" 
                                   step="50"
                                   onchange="updateFinalToken('${player}', this.value)"
                                   style="width: 100px; padding: 8px; border-radius: 6px; border: 2px solid #dee2e6; text-align: center; font-weight: bold;">
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateFinalToken(playerName, value) {
            const tokens = parseInt(value) || 0;
            currentGame.finalTokens[playerName] = tokens;
            updateBalanceCheck();
            updateFinalResults();
            saveCurrentGame();
        }

        function updateBalanceCheck() {
            const balanceDiv = document.getElementById('balance-check');
            const totalBuyTokens = Object.values(currentGame.buyIns).reduce((sum, tokens) => sum + tokens, 0);
            const totalFinalTokens = Object.values(currentGame.finalTokens).reduce((sum, tokens) => sum + tokens, 0);
            const tokenDifference = totalBuyTokens - totalFinalTokens;
            
            const totalBuyMoney = (totalBuyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const totalFinalMoney = (totalFinalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const moneyDifference = totalBuyMoney - totalFinalMoney;

            balanceDiv.innerHTML = `
                <div class="summary-box">
                    <h4 style="margin-bottom: 10px;">⚖️ بررسی تعادل</h4>
                    <div class="summary-row">
                        <span>کل خریدها:</span>
                        <span>${totalBuyTokens} ژتون (${totalBuyMoney.toLocaleString()} تومان)</span>
                    </div>
                    <div class="summary-row">
                        <span>کل ژتون‌های نهایی:</span>
                        <span>${totalFinalTokens} ژتون (${totalFinalMoney.toLocaleString()} تومان)</span>
                    </div>
                    <div class="summary-row">
                        <span>اختلاف:</span>
                        <span style="color: ${Math.abs(moneyDifference) > 10000 ? '#dc3545' : '#28a745'}">
                            ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                        </span>
                    </div>
                </div>
            `;

            const saveBtn = document.getElementById('save-btn');
            
            if (Math.abs(moneyDifference) > 50000) {
                balanceDiv.innerHTML += `
                    <div class="balance-error">
                        ❌ خطای جدی در حسابها!
                        <br>اختلاف: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                        <br>لطفا ژتون‌های نهایی را بررسی کنید
                    </div>
                `;
                saveBtn.disabled = true;
                saveBtn.style.opacity = '0.5';
            } else if (Math.abs(moneyDifference) > 10000) {
                balanceDiv.innerHTML += `
                    <div class="balance-warning">
                        ⚠️ هشدار: اختلاف در حسابها
                        <br>اختلاف: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
            } else if (moneyDifference === 0) {
                balanceDiv.innerHTML += `
                    <div class="balance-success">
                        ✅ حسابها کاملاً متعادل است!
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
            } else {
                balanceDiv.innerHTML += `
                    <div class="balance-success">
                        ✅ حسابها تقریباً متعادل است
                        <br>اختلاف جزئی: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
            }
        }

        function updateFinalResults() {
            const resultsDiv = document.getElementById('final-results');
            resultsDiv.innerHTML = '<h4 style="margin: 20px 0 10px 0;">🏆 نتایج نهایی:</h4>';

            let hasResults = false;

            currentGame.players.forEach(player => {
                const buyTokens = currentGame.buyIns[player] || 0;
                const finalTokens = currentGame.finalTokens[player] || 0;
                
                if (finalTokens > 0) {
                    hasResults = true;
                    const tokenProfit = finalTokens - buyTokens;
                    
                    const buyMoney = (buyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                    const finalMoney = (finalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                    const moneyProfit = finalMoney - buyMoney;
                    
                    currentGame.results[player] = moneyProfit;

                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'game-result';
                    resultDiv.innerHTML = `
                        <div class="player-name">${player}</div>
                        <div>خرید: ${buyTokens} ژتون (${buyMoney.toLocaleString()} تومان)</div>
                        <div>ژتون نهایی: ${finalTokens} ژتون (${finalMoney.toLocaleString()} تومان)</div>
                        <div class="${moneyProfit >= 0 ? 'profit' : 'loss'}" style="font-size: 18px; margin-top: 5px;">
                            ${moneyProfit >= 0 ? '🎉 برد' : '💔 باخت'}: ${Math.abs(moneyProfit).toLocaleString()} تومان
                        </div>
                    `;
                    resultsDiv.appendChild(resultDiv);
                }
            });

            if (!hasResults) {
                resultsDiv.innerHTML += '<p style="text-align: center; color: #666; padding: 20px;">هنوز ژتون نهایی ثبت نشده</p>';
            }
        }

        function saveGame() {
            const allTokensSet = currentGame.players.every(player => 
                currentGame.finalTokens[player] > 0
            );
            
            if (!allTokensSet) {
                showAlert('لطفا ژتون نهایی تمام بازیکنان را وارد کنید', 'danger');
                return;
            }

            const totalBuyTokens = Object.values(currentGame.buyIns).reduce((sum, tokens) => sum + tokens, 0);
            const totalFinalTokens = Object.values(currentGame.finalTokens).reduce((sum, tokens) => sum + tokens, 0);
            const totalBuyMoney = (totalBuyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const totalFinalMoney = (totalFinalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const moneyDifference = Math.abs(totalBuyMoney - totalFinalMoney);

            if (moneyDifference > 50000) {
                showAlert('خطای جدی در حسابها! امکان ذخیره وجود ندارد', 'danger');
                return;
            }

            if (moneyDifference > 10000) {
                showConfirm(`هشدار: اختلاف ${moneyDifference.toLocaleString()} تومان در حسابها وجود دارد. آیا مطمئنید؟`, () => {
                    performSave();
                });
                return;
            }

            performSave();
        }

        function performSave() {
            const gameToSave = {
                ...currentGame,
                buyInsTokens: currentGame.buyIns,
                finalTokensCount: currentGame.finalTokens,
                buyIns: {},
                finalChips: {}
            };

            currentGame.players.forEach(player => {
                gameToSave.buyIns[player] = (currentGame.buyIns[player] / TOKENS_PER_BUY) * PRICE_PER_BUY;
                gameToSave.finalChips[player] = (currentGame.finalTokens[player] / TOKENS_PER_BUY) * PRICE_PER_BUY;
            });

            gameHistory.push(gameToSave);
            localStorage.setItem('pokerGameHistory', JSON.stringify(gameHistory));
            localStorage.removeItem('currentGame'); // حذف auto-save
            
            showAlert('🎉 بازی با موفقیت ذخیره شد!', 'success');
            
            setTimeout(() => {
                resetGame();
            }, 2000);
        }

        function resetGame() {
            currentGame = {
                date: '',
                players: [],
                buyIns: {},
                finalTokens: {},
                results: {}
            };

            document.getElementById('finish-section').style.display = 'none';
            document.getElementById('finish-btn').style.display = 'block';
            document.getElementById('saved-game-notice').innerHTML = '';

            setDefaultPersianDate();
            renderAvailablePlayers();
            renderActivePlayers();
            updateGameSummary();
        }

        function startNewGame() {
            if (currentGame.players.length > 0) {
                showConfirm('آیا مطمئنید؟ بازی فعلی ذخیره نشده حذف خواهد شد.', () => {
                    localStorage.removeItem('currentGame');
                    resetGame();
                    closeMenu();
                    showAlert('بازی جدید شروع شد', 'success');
                });
            } else {
                localStorage.removeItem('currentGame');
                resetGame();
                closeMenu();
            }
        }

        // مدیریت بازیکنان
        function addNewPlayer() {
            const input = document.getElementById('new-player-input');
            const playerName = input.value.trim();

            if (!playerName) {
                showAlert('لطفا نام بازیکن را وارد کنید', 'danger');
                return;
            }

            if (allPlayersList.includes(playerName)) {
                showAlert('این بازیکن قبلاً ثبت شده است', 'warning');
                return;
            }

            allPlayersList.push(playerName);
            localStorage.setItem('allPlayersList', JSON.stringify(allPlayersList));
            input.value = '';
            
            renderAllPlayersList();
            renderAvailablePlayers();
            showAlert(`${playerName} اضافه شد`, 'success');
        }

        function renderAllPlayersList() {
            const container = document.getElementById('all-players-list');
            
            if (allPlayersList.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">هنوز بازیکنی ثبت نشده</p>';
                return;
            }

            container.innerHTML = '<h4 style="margin: 20px 0 10px 0;">لیست بازیکنان:</h4>';

            allPlayersList.forEach((player, index) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-row';
                playerDiv.innerHTML = `
                    <div class="player-info">
                        <div class="player-name">${player}</div>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn btn-danger btn-small" onclick="deletePlayer(${index})">حذف</button>
                    </div>
                `;
                container.appendChild(playerDiv);
            });
        }

        function deletePlayer(index) {
            const playerName = allPlayersList[index];
            showConfirm(`آیا مطمئنید که می‌خواهید "${playerName}" را حذف کنید؟`, () => {
                allPlayersList.splice(index, 1);
                localStorage.setItem('allPlayersList', JSON.stringify(allPlayersList));
                renderAllPlayersList();
                renderAvailablePlayers();
                showAlert('بازیکن حذف شد', 'info');
            });
        }

        // تاریخچه و آمار
        function loadHistory() {
            const historyDiv = document.getElementById('games-history');
            
            if (gameHistory.length === 0) {
                historyDiv.innerHTML = '<p style="text-align: center; color: #666; margin: 40px 0;">هنوز بازی‌ای ثبت نشده است</p>';
                return;
            }

            historyDiv.innerHTML = '';

            [...gameHistory].reverse().forEach((game, index) => {
                const gameDiv = document.createElement('div');
                gameDiv.className = 'history-item';
                
                let playersResults = '';
                Object.keys(game.results).forEach(player => {
                    const result = game.results[player];
                    playersResults += `
                        <div class="player-result">
                            <span>${player}</span>
                            <span class="${result >= 0 ? 'profit' : 'loss'}">
                                ${result >= 0 ? '+' : ''}${result.toLocaleString()}
                            </span>
                        </div>
                    `;
                });

                const totalBuyMoney = Object.values(game.buyIns).reduce((sum, money) => sum + money, 0);

                gameDiv.innerHTML = `
                    <div class="history-date">📅 ${game.date}</div>
                    <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                        کل پول بازی: ${totalBuyMoney.toLocaleString()} تومان | ${game.players.length} بازیکن
                    </div>
                    ${playersResults}
                    <button onclick="deleteGame(${gameHistory.length - 1 - index})" 
                            class="btn btn-danger btn-small" style="margin-top: 10px;">
                        🗑️ حذف بازی
                    </button>
                `;
                
                historyDiv.appendChild(gameDiv);
            });
        }

        function deleteGame(index) {
            const game = gameHistory[index];
            
            showConfirm(`آیا مطمئنید که می‌خواهید بازی تاریخ ${game.date} را حذف کنید؟`, () => {
                gameHistory.splice(index, 1);
                localStorage.setItem('pokerGameHistory', JSON.stringify(gameHistory));
                loadHistory();
                showAlert('بازی حذف شد', 'info');
            });
        }

        function loadStats() {
            const statsDiv = document.getElementById('players-stats');
            
            if (gameHistory.length === 0) {
                statsDiv.innerHTML = '<p style="text-align: center; color: #666; margin: 40px 0;">هنوز بازی‌ای ثبت نشده است</p>';
                return;
            }

            const playerStats = {};

            gameHistory.forEach(game => {
                Object.keys(game.results).forEach(player => {
                    if (!playerStats[player]) {
                        playerStats[player] = {
                            totalGames: 0,
                            totalProfit: 0,
                            wins: 0,
                            losses: 0,
                            totalBuyIn: 0,
                            bestGame: 0,
                            worstGame: 0
                        };
                    }
                    
                    const result = game.results[player];
                    playerStats[player].totalGames++;
                    playerStats[player].totalProfit += result;
                    playerStats[player].totalBuyIn += game.buyIns[player];
                    
                    if (result > 0) {
                        playerStats[player].wins++;
                    } else if (result < 0) {
                        playerStats[player].losses++;
                    }

                    if (result > playerStats[player].bestGame) {
                        playerStats[player].bestGame = result;
                    }
                    if (result < playerStats[player].worstGame) {
                        playerStats[player].worstGame = result;
                    }
                });
            });

            statsDiv.innerHTML = '';

            const sortedPlayers = Object.keys(playerStats).sort((a, b) => 
                playerStats[b].totalProfit - playerStats[a].totalProfit
            );

            sortedPlayers.forEach(player => {
                const stats = playerStats[player];
                const winRate = stats.totalGames > 0 ? (stats.wins / stats.totalGames * 100).toFixed(1) : 0;
                const avgProfit = stats.totalGames > 0 ? (stats.totalProfit / stats.totalGames) : 0;
                
                const statsCard = document.createElement('div');
                statsCard.className = 'stats-card';
                statsCard.innerHTML = `
                    <h4 style="margin-bottom: 15px;">👤 ${player}</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center;">
                        <div>
                            <div class="stats-number">${stats.totalGames}</div>
                            <div class="stats-label">تعداد بازی</div>
                        </div>
                        <div>
                            <div class="stats-number" style="color: white;">
                                ${stats.totalProfit >= 0 ? '+' : ''}${stats.totalProfit.toLocaleString()}
                            </div>
                            <div class="stats-label">سود/زیان کل</div>
                        </div>
                        <div>
                            <div class="stats-number">${winRate}%</div>
                            <div class="stats-label">درصد برد</div>
                        </div>
                        <div>
                            <div class="stats-number">${avgProfit >= 0 ? '+' : ''}${Math.round(avgProfit).toLocaleString()}</div>
                            <div class="stats-label">میانگین سود</div>
                        </div>
                    </div>
                    <div style="margin-top: 15px; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>🏆 بهترین:</span>
                            <span>+${stats.bestGame.toLocaleString()}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>💔 بدترین:</span>
                            <span>${stats.worstGame.toLocaleString()}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>💰 کل خرید:</span>
                            <span>${stats.totalBuyIn.toLocaleString()}</span>
                        </div>
                    </div>
                `;
                
                statsDiv.appendChild(statsCard);
            });
        }

        // UI Functions
        function openMenu() {
            document.getElementById('sideMenu').classList.add('open');
            document.querySelector('.menu-overlay').classList.add('show');
        }

        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            document.querySelector('.menu-overlay').classList.remove('show');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            closeMenu();

            if (pageId === 'players') {
                renderAllPlayersList();
            } else if (pageId === 'history') {
                loadHistory();
            } else if (pageId === 'stats') {
                loadStats();
            }
        }

        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            
            const activeTab = document.querySelector('.page.active');
            const mainContent = activeTab.querySelector('.main-content') || activeTab;
            mainContent.insertBefore(alertDiv, mainContent.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 4000);
        }

        function showConfirm(message, callback) {
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('confirmModal').style.display = 'block';
            confirmCallback = callback;
        }

        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
                confirmCallback = null;
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            confirmCallback = null;
        }

        // Event listeners
        document.getElementById('new-player-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addNewPlayer();
            }
        });
    </script>
