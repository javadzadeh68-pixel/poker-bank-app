<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بانک پوکر</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2a5298">
    <meta name="application-name" content="بانک پوکر">
    <meta name="apple-mobile-web-app-title" content="بانک پوکر">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            color: #2a5298;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(42, 82, 152, 0.3);
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: #1e3c72;
            transform: scale(1.1);
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        .side-menu.open {
            left: 0;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .menu-overlay.show {
            display: block;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
        }

        .menu-close {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border: none;
            border-radius: 10px;
            text-align: right;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            border-right: 4px solid #2a5298;
        }

        .menu-item:hover {
            background: #e9ecef;
            transform: translateX(-5px);
        }

        .main-content {
            transition: all 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #2a5298;
            color: white;
        }

        .btn-primary:hover {
            background: #1e3c72;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            width: auto;
            padding: 8px 15px;
            margin-bottom: 20px;
        }

        .btn-small {
            width: auto;
            padding: 5px 10px;
            font-size: 14px;
            margin: 2px;
        }

        .player-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 4px solid #2a5298;
            position: relative;
        }

        .player-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 5px;
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 5px;
            padding-left: 80px;
        }

        .player-stats {
            font-size: 14px;
            color: #666;
        }

        .game-result {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .profit {
            color: #28a745;
            font-weight: bold;
        }

        .loss {
            color: #dc3545;
            font-weight: bold;
        }

        .history-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .history-date {
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 10px;
        }

        .player-result {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stats-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .balance-warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .balance-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .balance-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .summary-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20% auto;
            max-width: 320px;
            text-align: center;
            position: relative;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .quick-actions {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .quick-actions h4 {
            margin-bottom: 10px;
            color: #2a5298;
        }

        .player-quick-select {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .player-chip {
            background: #2a5298;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            transition: all 0.3s;
        }

        .player-chip:hover {
            background: #1e3c72;
        }

        .player-chip.selected {
            background: #28a745;
        }

        .chip-info {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2a5298;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="menu-overlay" onclick="closeMenu()"></div>
    
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>📋 منوی اصلی</h3>
            <button class="menu-close" onclick="closeMenu()">✕</button>
        </div>
        <button class="menu-item" onclick="showPage('history')">📜 تاریخچه بازی‌ها</button>
        <button class="menu-item" onclick="showPage('stats')">📊 آمار بازیکنان</button>
        <button class="menu-item" onclick="showPage('main')">🎰 صفحه اصلی</button>
    </div>

    <div class="container">
        <div class="header">
            <button class="menu-btn" onclick="openMenu()">☰</button>
            <h1>🎰 بانک پوکر</h1>
            <p>مدیریت کامل حسابداری بازی‌های پوکر</p>
        </div>

        <!-- صفحه اصلی -->
        <div id="main" class="page active">
            <div class="main-content">
                <div id="setup-phase">
                    <h3 style="margin-bottom: 15px;">📋 تنظیمات بازی</h3>
                    
                    <div class="form-group">
                        <label>تاریخ بازی (شمسی):</label>
                        <input type="text" id="game-date" placeholder="مثال: 1403/09/06" readonly onclick="showDatePicker()">
                    </div>

                    <div class="form-group">
                        <label>نام بازیکن:</label>
                        <input type="text" id="player-name" placeholder="نام بازیکن را وارد کنید">
                    </div>

                    <button class="btn btn-primary" onclick="addPlayer()">➕ اضافه کردن بازیکن</button>

                    <div id="players-list"></div>

                    <button class="btn btn-success" onclick="startGame()" style="margin-top: 20px;">🎮 شروع بازی</button>
                </div>

                <div id="game-phase" style="display: none;">
                    <h3 style="margin-bottom: 15px;">🎯 مرحله بازی</h3>
                    
                    <div class="chip-info">
                        💰 هر خرید = 500 ژتون = 100,000 تومان
                    </div>

                    <div class="quick-actions">
                        <h4>انتخاب سریع بازیکن:</h4>
                        <div class="player-quick-select" id="player-chips"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>تعداد خرید:</label>
                        <input type="number" id="buy-count" placeholder="تعداد خرید (هر خرید 500 ژتون)" min="1" step="0.5">
                    </div>

                    <button class="btn btn-primary" onclick="addBuyIn()">💰 ثبت خرید</button>

                    <button class="btn btn-secondary" onclick="showAddPlayerInGame()" style="margin-top: 10px;">👤 اضافه کردن بازیکن جدید</button>

                    <div id="add-player-in-game" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;">
                        <div class="form-group">
                            <label>نام بازیکن جدید:</label>
                            <input type="text" id="new-player-name" placeholder="نام بازیکن جدید">
                        </div>
                        <button class="btn btn-primary" onclick="addPlayerInGame()">➕ اضافه کردن</button>
                        <button class="btn btn-secondary" onclick="hideAddPlayerInGame()">لغو</button>
                    </div>

                    <div id="current-game-info"></div>

                    <button class="btn btn-success" onclick="finishGame()" style="margin-top: 20px;">🏁 پایان بازی</button>
                </div>

                <div id="finish-phase" style="display: none;">
                    <h3 style="margin-bottom: 15px;">🏆 پایان بازی</h3>
                    
                    <div class="chip-info">
                        🎲 هر 500 ژتون = 100,000 تومان
                    </div>

                    <div class="quick-actions">
                        <h4>انتخاب سریع بازیکن:</h4>
                        <div class="player-quick-select" id="finish-player-chips"></div>
                    </div>

                    <div class="form-group">
                        <label>تعداد ژتون نهایی:</label>
                        <input type="number" id="final-tokens" placeholder="تعداد ژتون‌های نهایی" min="0" step="50">
                    </div>

                    <button class="btn btn-primary" onclick="setFinalTokens()">🎲 ثبت ژتون نهایی</button>

                    <div id="balance-check"></div>
                    <div id="final-results"></div>

                    <button class="btn btn-success" onclick="saveGame()" id="save-btn">💾 ذخیره بازی</button>
                    <button class="btn btn-secondary" onclick="resetGame()">🔄 بازی جدید</button>
                </div>
            </div>
        </div>

        <!-- صفحه تاریخچه -->
        <div id="history" class="page">
            <button class="btn btn-back" onclick="showPage('main')">← برگشت</button>
            <h3 style="margin-bottom: 15px;">📜 تاریخچه بازی‌ها</h3>
            <div id="games-history"></div>
        </div>

        <!-- صفحه آمار -->
        <div id="stats" class="page">
            <button class="btn btn-back" onclick="showPage('main')">← برگشت</button>
            <h3 style="margin-bottom: 15px;">📊 آمار بازیکنان</h3>
            <div id="players-stats"></div>
        </div>
    </div>

    <!-- مودال تایید -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div id="modal-message"></div>
            <div class="modal-buttons">
                <button class="modal-btn" style="background: #28a745; color: white;" onclick="confirmAction()">تایید</button>
                <button class="modal-btn" style="background: #6c757d; color: white;" onclick="closeModal()">لغو</button>
            </div>
        </div>
    </div>

    <!-- مودال انتخاب تاریخ -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <h4 style="margin-bottom: 15px;">انتخاب تاریخ</h4>
            <div class="form-group">
                <label>سال:</label>
                <select id="year-select"></select>
            </div>
            <div class="form-group">
                <label>ماه:</label>
                <select id="month-select"></select>
            </div>
            <div class="form-group">
                <label>روز:</label>
                <select id="day-select"></select>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" style="background: #28a745; color: white;" onclick="setSelectedDate()">تایید</button>
                <button class="modal-btn" style="background: #6c757d; color: white;" onclick="closeDateModal()">لغو</button>
            </div>
        </div>
    </div>

    <script>
        let currentGame = {
            date: '',
            players: [],
            buyIns: {},
            finalTokens: {},
            results: {}
        };

        let gameHistory = JSON.parse(localStorage.getItem('pokerGameHistory') || '[]');
        let allPlayers = new Set(JSON.parse(localStorage.getItem('pokerAllPlayers') || '[]'));
        let confirmCallback = null;
        let selectedPlayer = null;
        let finishSelectedPlayer = null;

        const TOKENS_PER_BUY = 500;
        const PRICE_PER_BUY = 100000; // 100,000 تومان

        const persianMonths = [
            'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
            'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
        ];

        // تنظیم تاریخ شمسی پیش‌فرض
        setDefaultPersianDate();

        function setDefaultPersianDate() {
            const today = new Date();
            const persianDate = gregorianToPersian(today);
            document.getElementById('game-date').value = `${persianDate.year}/${persianDate.month.toString().padStart(2, '0')}/${persianDate.day.toString().padStart(2, '0')}`;
        }

        function gregorianToPersian(gregorianDate) {
            // ساده‌سازی تبدیل تاریخ - در محیط واقعی از کتابخانه دقیق‌تری استفاده کنید
            const g_y = gregorianDate.getFullYear();
            const g_m = gregorianDate.getMonth() + 1;
            const g_d = gregorianDate.getDate();
            
            // تخمین ساده برای تبدیل
            let p_y = g_y - 621;
            if (g_m < 3 || (g_m === 3 && g_d < 21)) {
                p_y--;
            }
            
            const p_m = ((g_m + 9) % 12) + 1;
            const p_d = Math.min(g_d, 30);
            
            return { year: p_y, month: p_m, day: p_d };
        }

        function showDatePicker() {
            const modal = document.getElementById('dateModal');
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const daySelect = document.getElementById('day-select');
            
            // پر کردن سال‌ها
            yearSelect.innerHTML = '';
            for (let year = 1400; year <= 1410; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === 1403) option.selected = true;
                yearSelect.appendChild(option);
            }
            
            // پر کردن ماه‌ها
            monthSelect.innerHTML = '';
            persianMonths.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
            
            // پر کردن روزها
            updateDaySelect();
            
            modal.style.display = 'block';
        }

        function updateDaySelect() {
            const daySelect = document.getElementById('day-select');
            daySelect.innerHTML = '';
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            }
        }

        function setSelectedDate() {
            const year = document.getElementById('year-select').value;
            const month = document.getElementById('month-select').value.padStart(2, '0');
            const day = document.getElementById('day-select').value.padStart(2, '0');
            
            document.getElementById('game-date').value = `${year}/${month}/${day}`;
            closeDateModal();
        }

        function closeDateModal() {
            document.getElementById('dateModal').style.display = 'none';
        }

        // باقی توابع...
        document.getElementById('month-select').addEventListener('change', updateDaySelect);

        function openMenu() {
            document.getElementById('sideMenu').classList.add('open');
            document.querySelector('.menu-overlay').classList.add('show');
        }

        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            document.querySelector('.menu-overlay').classList.remove('show');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            closeMenu();

            if (pageId === 'history') {
                loadHistory();
            } else if (pageId === 'stats') {
                loadStats();
            }
        }

        function addPlayer() {
            const playerName = document.getElementById('player-name').value.trim();
            
            if (!playerName) {
                showAlert('لطفا نام بازیکن را وارد کنید', 'danger');
                return;
            }

            if (currentGame.players.includes(playerName)) {
                showAlert('این بازیکن قبلا اضافه شده است', 'danger');
                return;
            }

            currentGame.players.push(playerName);
            allPlayers.add(playerName);
            currentGame.buyIns[playerName] = 0;
            currentGame.finalTokens[playerName] = 0;

            document.getElementById('player-name').value = '';
            updatePlayersList();
            saveToStorage();
        }

        function movePlayerUp(playerName) {
            const index = currentGame.players.indexOf(playerName);
            if (index > 0) {
                [currentGame.players[index], currentGame.players[index - 1]] = 
                [currentGame.players[index - 1], currentGame.players[index]];
                updatePlayersList();
            }
        }

        function movePlayerDown(playerName) {
            const index = currentGame.players.indexOf(playerName);
            if (index < currentGame.players.length - 1) {
                [currentGame.players[index], currentGame.players[index + 1]] = 
                [currentGame.players[index + 1], currentGame.players[index]];
                updatePlayersList();
            }
        }

        function removePlayer(playerName) {
            showConfirm(`آیا مطمئنید که می‌خواهید "${playerName}" را حذف کنید؟`, () => {
                const index = currentGame.players.indexOf(playerName);
                if (index > -1) {
                    currentGame.players.splice(index, 1);
                    delete currentGame.buyIns[playerName];
                    delete currentGame.finalTokens[playerName];
                    updatePlayersList();
                }
            });
        }

        function updatePlayersList() {
            const playersList = document.getElementById('players-list');
            playersList.innerHTML = '';

            if (currentGame.players.length === 0) {
                playersList.innerHTML = '<p style="text-align: center; color: #666; margin: 20px 0;">هنوز بازیکنی اضافه نشده</p>';
                return;
            }

            currentGame.players.forEach((player, index) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                
                const totalMoney = (currentGame.buyIns[player] / TOKENS_PER_BUY) * PRICE_PER_BUY;
                
                playerDiv.innerHTML = `
                    <div class="player-controls">
                        ${index > 0 ? `<button class="btn btn-secondary btn-small" onclick="movePlayerUp('${player}')">↑</button>` : ''}
                        ${index < currentGame.players.length - 1 ? `<button class="btn btn-secondary btn-small" onclick="movePlayerDown('${player}')">↓</button>` : ''}
                        <button class="btn btn-danger btn-small" onclick="removePlayer('${player}')">✕</button>
                    </div>
                    <div class="player-name">${player}</div>
                    <div class="player-stats">خرید: ${currentGame.buyIns[player]} ژتون (${totalMoney.toLocaleString()} تومان)</div>
                `;
                playersList.appendChild(playerDiv);
            });
        }

        function startGame() {
            if (currentGame.players.length < 2) {
                showAlert('حداقل 2 بازیکن برای شروع بازی نیاز است', 'danger');
                return;
            }

            currentGame.date = document.getElementById('game-date').value;
            
            if (!currentGame.date) {
                showAlert('لطفا تاریخ بازی را انتخاب کنید', 'danger');
                return;
            }

            document.getElementById('setup-phase').style.display = 'none';
            document.getElementById('game-phase').style.display = 'block';

            updatePlayerChips();
            updateGameInfo();
        }

        function updatePlayerChips() {
            const playerChips = document.getElementById('player-chips');
            playerChips.innerHTML = '';
            
            currentGame.players.forEach(player => {
                const chip = document.createElement('button');
                chip.className = 'player-chip';
                chip.textContent = player;
                chip.onclick = () => selectPlayer(player);
                playerChips.appendChild(chip);
            });
        }

        function selectPlayer(playerName) {
            selectedPlayer = playerName;
            document.querySelectorAll('#player-chips .player-chip').forEach(chip => {
                chip.classList.remove('selected');
                if (chip.textContent === playerName) {
                    chip.classList.add('selected');
                }
            });
        }

        function addBuyIn() {
            if (!selectedPlayer) {
                showAlert('لطفا ابتدا یک بازیکن انتخاب کنید', 'danger');
                return;
            }

            const buyCount = parseFloat(document.getElementById('buy-count').value) || 0;

            if (buyCount <= 0) {
                showAlert('تعداد خرید باید بیشتر از صفر باشد', 'danger');
                return;
            }

            const tokensToAdd = buyCount * TOKENS_PER_BUY;
            currentGame.buyIns[selectedPlayer] = (currentGame.buyIns[selectedPlayer] || 0) + tokensToAdd;
            
            document.getElementById('buy-count').value = '';
            
            const moneyAmount = buyCount * PRICE_PER_BUY;
            updateGameInfo();
            showAlert(`خرید ${buyCount} عدد (${tokensToAdd} ژتون - ${moneyAmount.toLocaleString()} تومان) برای ${selectedPlayer} ثبت شد`, 'success');
        }

        function showAddPlayerInGame() {
            document.getElementById('add-player-in-game').style.display = 'block';
        }

        function hideAddPlayerInGame() {
            document.getElementById('add-player-in-game').style.display = 'none';
            document.getElementById('new-player-name').value = '';
        }

        function addPlayerInGame() {
            const playerName = document.getElementById('new-player-name').value.trim();
            
            if (!playerName) {
                showAlert('لطفا نام بازیکن را وارد کنید', 'danger');
                return;
            }

            if (currentGame.players.includes(playerName)) {
                showAlert('این بازیکن قبلا اضافه شده است', 'danger');
                return;
            }

            currentGame.players.push(playerName);
            allPlayers.add(playerName);
            currentGame.buyIns[playerName] = 0;
            currentGame.finalTokens[playerName] = 0;

            hideAddPlayerInGame();
            updatePlayerChips();
            updateGameInfo();
            saveToStorage();
            
            showAlert(`${playerName} به بازی اضافه شد`, 'success');
        }

        function updateGameInfo() {
            const gameInfo = document.getElementById('current-game-info');
            gameInfo.innerHTML = '<h4 style="margin: 20px 0 10px 0;">💰 خریدهای فعلی:</h4>';

            let totalTokens = 0;
            let totalMoney = 0;

            currentGame.players.forEach(player => {
                const tokens = currentGame.buyIns[player] || 0;
                const money = (tokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                totalTokens += tokens;
                totalMoney += money;

                const div = document.createElement('div');
                div.className = 'player-item';
                div.innerHTML = `
                    <div class="player-name">${player}</div>
                    <div class="player-stats">
                        ${tokens} ژتون (${money.toLocaleString()} تومان)
                    </div>
                `;
                gameInfo.appendChild(div);
            });

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary-box';
            summaryDiv.innerHTML = `
                <div class="summary-row">
                    <span>کل ژتون‌ها:</span>
                    <span>${totalTokens.toLocaleString()} ژتون</span>
                </div>
                <div class="summary-row">
                    <span>کل پول:</span>
                    <span>${totalMoney.toLocaleString()} تومان</span>
                </div>
            `;
            gameInfo.appendChild(summaryDiv);
        }

        function finishGame() {
            const totalTokens = Object.values(currentGame.buyIns).reduce((sum, tokens) => sum + tokens, 0);
            
            if (totalTokens === 0) {
                showAlert('ابتدا خریدهای بازیکنان را ثبت کنید', 'danger');
                return;
            }

            document.getElementById('game-phase').style.display = 'none';
            document.getElementById('finish-phase').style.display = 'block';

            updateFinishPlayerChips();
            updateFinalResults();
        }

        function updateFinishPlayerChips() {
            const finishPlayerChips = document.getElementById('finish-player-chips');
            finishPlayerChips.innerHTML = '';
            
            currentGame.players.forEach(player => {
                const chip = document.createElement('button');
                chip.className = 'player-chip';
                chip.textContent = player;
                chip.onclick = () => selectFinishPlayer(player);
                finishPlayerChips.appendChild(chip);
            });
        }

        function selectFinishPlayer(playerName) {
            finishSelectedPlayer = playerName;
            document.querySelectorAll('#finish-player-chips .player-chip').forEach(chip => {
                chip.classList.remove('selected');
                if (chip.textContent === playerName) {
                    chip.classList.add('selected');
                }
            });
        }

        function setFinalTokens() {
            if (!finishSelectedPlayer) {
                showAlert('لطفا ابتدا یک بازیکن انتخاب کنید', 'danger');
                return;
            }

            const finalTokens = parseInt(document.getElementById('final-tokens').value) || 0;

            if (finalTokens < 0) {
                showAlert('تعداد ژتون نهایی نمی‌تواند منفی باشد', 'danger');
                return;
            }

            currentGame.finalTokens[finishSelectedPlayer] = finalTokens;
            document.getElementById('final-tokens').value = '';

            updateFinalResults();
            updateBalanceCheck();
            
            const finalMoney = (finalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            showAlert(`ژتون نهایی ${finalTokens} عدد (${finalMoney.toLocaleString()} تومان) برای ${finishSelectedPlayer} ثبت شد`, 'success');
        }

        function updateBalanceCheck() {
            const balanceDiv = document.getElementById('balance-check');
            const totalBuyTokens = Object.values(currentGame.buyIns).reduce((sum, tokens) => sum + tokens, 0);
            const totalFinalTokens = Object.values(currentGame.finalTokens).reduce((sum, tokens) => sum + tokens, 0);
            const tokenDifference = totalBuyTokens - totalFinalTokens;
            
            const totalBuyMoney = (totalBuyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const totalFinalMoney = (totalFinalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const moneyDifference = totalBuyMoney - totalFinalMoney;

            balanceDiv.innerHTML = `
                <div class="summary-box">
                    <div class="summary-row">
                        <span>کل خریدها:</span>
                        <span>${totalBuyTokens} ژتون (${totalBuyMoney.toLocaleString()} تومان)</span>
                    </div>
                    <div class="summary-row">
                        <span>کل ژتون‌های نهایی:</span>
                        <span>${totalFinalTokens} ژتون (${totalFinalMoney.toLocaleString()} تومان)</span>
                    </div>
                    <div class="summary-row">
                        <span>اختلاف:</span>
                        <span>${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)</span>
                    </div>
                </div>
            `;

            const saveBtn = document.getElementById('save-btn');
            
            if (Math.abs(moneyDifference) > 50000) { // اختلاف بیش از 50 هزار تومان
                balanceDiv.innerHTML += `
                    <div class="balance-error">
                        ❌ خطای جدی در حسابها!
                        <br>اختلاف: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                        <br>لطفا ژتون‌های نهایی را بررسی کنید
                    </div>
                `;
                saveBtn.disabled = true;
                saveBtn.style.opacity = '0.5';
                saveBtn.textContent = '❌ امکان ذخیره وجود ندارد';
            } else if (Math.abs(moneyDifference) > 10000) { // اختلاف 10-50 هزار تومان
                balanceDiv.innerHTML += `
                    <div class="balance-warning">
                        ⚠️ هشدار: اختلاف در حسابها
                        <br>اختلاف: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                        <br>آیا مطمئنید؟
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
                saveBtn.textContent = '💾 ذخیره با هشدار';
            } else if (moneyDifference === 0) {
                balanceDiv.innerHTML += `
                    <div class="balance-success">
                        ✅ حسابها کاملاً متعادل است!
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
                saveBtn.textContent = '💾 ذخیره بازی';
            } else {
                balanceDiv.innerHTML += `
                    <div class="balance-success">
                        ✅ حسابها تقریباً متعادل است
                        <br>اختلاف جزئی: ${tokenDifference} ژتون (${moneyDifference.toLocaleString()} تومان)
                    </div>
                `;
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
                saveBtn.textContent = '💾 ذخیره بازی';
            }
        }

        function updateFinalResults() {
            const resultsDiv = document.getElementById('final-results');
            resultsDiv.innerHTML = '<h4 style="margin: 20px 0 10px 0;">🏆 نتایج نهایی:</h4>';

            currentGame.players.forEach(player => {
                const buyTokens = currentGame.buyIns[player] || 0;
                const finalTokens = currentGame.finalTokens[player] || 0;
                const tokenProfit = finalTokens - buyTokens;
                
                const buyMoney = (buyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                const finalMoney = (finalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
                const moneyProfit = finalMoney - buyMoney;
                
                currentGame.results[player] = moneyProfit;

                const resultDiv = document.createElement('div');
                resultDiv.className = 'game-result';
                resultDiv.innerHTML = `
                    <div class="player-name">${player}</div>
                    <div>خرید: ${buyTokens} ژتون (${buyMoney.toLocaleString()} تومان)</div>
                    <div>ژتون نهایی: ${finalTokens} ژتون (${finalMoney.toLocaleString()} تومان)</div>
                    <div class="${moneyProfit >= 0 ? 'profit' : 'loss'}">
                        ${moneyProfit >= 0 ? 'برد' : 'باخت'}: ${Math.abs(moneyProfit).toLocaleString()} تومان
                    </div>
                `;
                resultsDiv.appendChild(resultDiv);
            });
        }

        function saveGame() {
            const totalBuyTokens = Object.values(currentGame.buyIns).reduce((sum, tokens) => sum + tokens, 0);
            const totalFinalTokens = Object.values(currentGame.finalTokens).reduce((sum, tokens) => sum + tokens, 0);
            const totalBuyMoney = (totalBuyTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const totalFinalMoney = (totalFinalTokens / TOKENS_PER_BUY) * PRICE_PER_BUY;
            const moneyDifference = Math.abs(totalBuyMoney - totalFinalMoney);
            
            // بررسی اینکه همه ژتون‌های نهایی ثبت شده باشد
            const allTokensSet = currentGame.players.every(player => 
                currentGame.finalTokens[player] !== undefined && currentGame.finalTokens[player] >= 0
            );
            
            if (!allTokensSet) {
                showAlert('لطفا ژتون نهایی تمام بازیکنان را ثبت کنید', 'danger');
                return;
            }

            // اگر اختلاف زیاد باشد، نیاز به تایید
            if (moneyDifference > 50000) {
                showAlert('خطای جدی در حسابها! امکان ذخیره وجود ندارد', 'danger');
                return;
            }

            if (moneyDifference > 10000) {
                showConfirm(`هشدار: اختلاف ${moneyDifference.toLocaleString()} تومان در حسابها وجود دارد. آیا مطمئنید که می‌خواهید ذخیره کنید؟`, () => {
                    performSave();
                });
                return;
            }

            performSave();
        }

        function performSave() {
            // تبدیل buyIns به پول برای ذخیره
            const gameToSave = {
                ...currentGame,
                buyInsTokens: currentGame.buyIns, // ذخیره ژتون‌ها
                finalTokensCount: currentGame.finalTokens, // ذخیره ژتون‌های نهایی
                buyIns: {},
                finalChips: {}
            };

            // تبدیل به پول برای نمایش در تاریخچه
            currentGame.players.forEach(player => {
                gameToSave.buyIns[player] = (currentGame.buyIns[player] / TOKENS_PER_BUY) * PRICE_PER_BUY;
                gameToSave.finalChips[player] = (currentGame.finalTokens[player] / TOKENS_PER_BUY) * PRICE_PER_BUY;
            });

            gameHistory.push(gameToSave);
            saveToStorage();
            
            showAlert('بازی با موفقیت ذخیره شد!', 'success');
            
            setTimeout(() => {
                resetGame();
            }, 2000);
        }

        function resetGame() {
            currentGame = {
                date: '',
                players: [],
                buyIns: {},
                finalTokens: {},
                results: {}
            };

            selectedPlayer = null;
            finishSelectedPlayer = null;

            document.getElementById('setup-phase').style.display = 'block';
            document.getElementById('game-phase').style.display = 'none';
            document.getElementById('finish-phase').style.display = 'none';
            document.getElementById('add-player-in-game').style.display = 'none';

            setDefaultPersianDate();
            document.getElementById('players-list').innerHTML = '';
            
            updatePlayersList();
        }

        function loadHistory() {
            const historyDiv = document.getElementById('games-history');
            
            if (gameHistory.length === 0) {
                historyDiv.innerHTML = '<p style="text-align: center; color: #666; margin: 40px 0;">هنوز بازی‌ای ثبت نشده است</p>';
                return;
            }

            historyDiv.innerHTML = '';

            [...gameHistory].reverse().forEach((game, index) => {
                const gameDiv = document.createElement('div');
                gameDiv.className = 'history-item';
                
                let playersResults = '';
                Object.keys(game.results).forEach(player => {
                    const result = game.results[player];
                    playersResults += `
                        <div class="player-result">
                            <span>${player}</span>
                            <span class="${result >= 0 ? 'profit' : 'loss'}">
                                ${result >= 0 ? '+' : ''}${result.toLocaleString()}
                            </span>
                        </div>
                    `;
                });

                const totalBuyMoney = Object.values(game.buyIns).reduce((sum, money) => sum + money, 0);

                gameDiv.innerHTML = `
                    <div class="history-date">📅 ${game.date}</div>
                    <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                        کل پول بازی: ${totalBuyMoney.toLocaleString()} تومان | ${game.players.length} بازیکن
                    </div>
                    ${playersResults}
                    <button onclick="deleteGame(${gameHistory.length - 1 - index})" 
                            style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; margin-top: 10px;">
                        🗑️ حذف
                    </button>
                `;
                
                historyDiv.appendChild(gameDiv);
            });
        }

        function deleteGame(index) {
            const game = gameHistory[index];
            
            showConfirm(`آیا مطمئنید که می‌خواهید بازی تاریخ ${game.date} را حذف کنید؟`, () => {
                gameHistory.splice(index, 1);
                saveToStorage();
                loadHistory();
                showAlert('بازی حذف شد', 'success');
            });
        }

        function loadStats() {
            const statsDiv = document.getElementById('players-stats');
            
            if (gameHistory.length === 0) {
                statsDiv.innerHTML = '<p style="text-align: center; color: #666; margin: 40px 0;">هنوز بازی‌ای ثبت نشده است</p>';
                return;
            }

            const playerStats = {};

            // محاسبه آمار
            gameHistory.forEach(game => {
                Object.keys(game.results).forEach(player => {
                    if (!playerStats[player]) {
                        playerStats[player] = {
                            totalGames: 0,
                            totalProfit: 0,
                            wins: 0,
                            losses: 0,
                            totalBuyIn: 0,
                            bestGame: 0,
                            worstGame: 0
                        };
                    }
                    
                    const result = game.results[player];
                    playerStats[player].totalGames++;
                    playerStats[player].totalProfit += result;
                    playerStats[player].totalBuyIn += game.buyIns[player];
                    
                    if (result > 0) {
                        playerStats[player].wins++;
                    } else if (result < 0) {
                        playerStats[player].losses++;
                    }

                    // بهترین و بدترین بازی
                    if (result > playerStats[player].bestGame) {
                        playerStats[player].bestGame = result;
                    }
                    if (result < playerStats[player].worstGame) {
                        playerStats[player].worstGame = result;
                    }
                });
            });

            statsDiv.innerHTML = '';

            // مرتب‌سازی بر اساس سود کل
            const sortedPlayers = Object.keys(playerStats).sort((a, b) => 
                playerStats[b].totalProfit - playerStats[a].totalProfit
            );

            sortedPlayers.forEach(player => {
                const stats = playerStats[player];
                const winRate = stats.totalGames > 0 ? (stats.wins / stats.totalGames * 100).toFixed(1) : 0;
                const avgProfit = stats.totalGames > 0 ? (stats.totalProfit / stats.totalGames) : 0;
                
                const statsCard = document.createElement('div');
                statsCard.className = 'stats-card';
                statsCard.innerHTML = `
                    <h4 style="margin-bottom: 15px;">👤 ${player}</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center;">
                        <div>
                            <div class="stats-number">${stats.totalGames}</div>
                            <div class="stats-label">تعداد بازی</div>
                        </div>
                        <div>
                            <div class="stats-number ${stats.totalProfit >= 0 ? 'profit' : 'loss'}" style="color: white;">
                                ${stats.totalProfit >= 0 ? '+' : ''}${stats.totalProfit.toLocaleString()}
                            </div>
                            <div class="stats-label">سود/زیان کل</div>
                        </div>
                        <div>
                            <div class="stats-number">${winRate}%</div>
                            <div class="stats-label">درصد برد</div>
                        </div>
                        <div>
                            <div class="stats-number">${avgProfit >= 0 ? '+' : ''}${Math.round(avgProfit).toLocaleString()}</div>
                            <div class="stats-label">میانگین سود</div>
                        </div>
                    </div>
                    <div style="margin-top: 15px; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>🏆 بهترین:</span>
                            <span class="profit">+${stats.bestGame.toLocaleString()}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>💔 بدترین:</span>
                            <span class="loss">${stats.worstGame.toLocaleString()}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>💰 کل خرید:</span>
                            <span>${stats.totalBuyIn.toLocaleString()}</span>
                        </div>
                    </div>
                `;
                
                statsDiv.appendChild(statsCard);
            });
        }

        function saveToStorage() {
            try {
                localStorage.setItem('pokerGameHistory', JSON.stringify(gameHistory));
                localStorage.setItem('pokerAllPlayers', JSON.stringify([...allPlayers]));
            } catch (error) {
                console.log('Storage not available, keeping in memory');
            }
        }

        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            
            const activeTab = document.querySelector('.page.active');
            const mainContent = activeTab.querySelector('.main-content') || activeTab;
            mainContent.insertBefore(alertDiv, mainContent.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 4000);
        }

        function showConfirm(message, callback) {
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('confirmModal').style.display = 'block';
            confirmCallback = callback;
        }

        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
                confirmCallback = null;
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            confirmCallback = null;
        }

        // Event listeners
        document.getElementById('player-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });

        document.getElementById('buy-count').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addBuyIn();
            }
        });

        document.getElementById('final-tokens').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                setFinalTokens();
            }
        });

        document.getElementById('new-player-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPlayerInGame();
            }
        });

        // Load data on startup
        updatePlayersList();
    </script>
</body>
</html>;
